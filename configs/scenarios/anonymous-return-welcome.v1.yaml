schema_version: v1
scenario:
  id: anonymous-return-welcome
  version: v1
  required:
    - capability: PERSON_PRESENCE
      provider_id: desktop-presence
    - capability: VOICE_ACTIVITY
      provider_id: desktop-vad
    - capability: DISPLAY_TEXT
      provider_id: web-avatar
  optional:
    # Biometric authorization and enrollment come from the runtime policy snapshot.
    - capability: FACE_IDENTIFICATION
      provider_id: local-face-identity
      fallback: ANONYMOUS_SUBJECT
    - capability: SPEAKER_IDENTIFICATION
      provider_id: local-speaker-identity
      fallback: ANONYMOUS_SUBJECT
    - capability: SPEECH_SYNTHESIS
      provider_id: speech-dispatcher
      fallback: VISUAL_ONLY
