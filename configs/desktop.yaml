schema_version: v1
extends: base.yaml
adapter:
  embodiment: desktop-avatar
  storage: sqlite
capabilities:
  attend_user: true
  acknowledge: true
  speak: true
  express: true
  locomotion: false
scenario_manifest: scenarios/anonymous-return-welcome.v1.yaml
media:
  # These document the first Ubuntu composition defaults; cmd/desktop accepts
  # explicit absolute flag overrides and never silently selects another device.
  camera_device: /dev/video0
  pulse_capture_binary: /usr/bin/pacat
  worker_python: .venv-media/bin/python3.10
  provider_lease: 15s
  provider_health_check: 1s
  worker_stop_timeout: 3s
privacy:
  camera_capture_default: false
  microphone_capture_default: false
  biometric_default: false
